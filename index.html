<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PRATTSEUL — Site officiel</title>

    <meta
        name="description"
        content="Site officiel de Prattseul — musique, vidéos, concerts, presse et actualités."
    >

    <link
        rel="canonical"
        href="https://prattseul.fr/"
    >

    <link
        rel="icon"
        type="image/png"
        href="images/prattseul_favicon.png"
    >

    <link
        rel="apple-touch-icon"
        href="images/prattseul_favicon.png"
    >


    <!-- ========================================
         BACKGROUND PRIORITAIRE
    ========================================= -->

    <link
        rel="preload"
        as="image"
        href="images/IMG02.jpg"
        fetchpriority="high"
    >


    <!-- ========================================
         CSS
    ========================================= -->

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="home-scroll.css"
    >

    <link
        rel="stylesheet"
        href="home-easter.css"
    >


    <!-- ========================================
         DONNÉES STRUCTURÉES
    ========================================= -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "Prattseul",
        "url": "https://prattseul.fr/",
        "sameAs": [
            "https://instagram.com/prattseul/",
            "https://facebook.com/prattseul",
            "https://tiktok.com/@prattseul",
            "https://youtube.com/prattseul",
            "https://open.spotify.com/artist/2fuNjNQ9TytbwINLWo8x0y",
            "https://link.deezer.com/s/349ou5JCWcltw1dXBCJPf",
            "https://music.apple.com/fr/artist/prattseul/1423294870"
        ]
    }
    </script>

</head>


<body data-home="true">


    <!-- ========================================
         NAVIGATION COMMUNE
    ========================================= -->

    <div id="site-navigation"></div>


    <!-- ========================================
         ACCUEIL
    ========================================= -->

    <main class="hero">


        <!-- ========================================
             MENU ACCUEIL
        ========================================= -->

        <nav
            class="home-menu"
            aria-label="Navigation principale"
        >

            <a href="about.html">
                à propos
            </a>

            <a href="films.html">
                vidéos
            </a>

            <a href="shows.html">
                concerts
            </a>

            <a href="press.html">
                presse
            </a>
            <a href="shop.html">
                shop
            </a>
            <a href="contact.html">
                contacts
            </a>

        </nav>


        <!-- ========================================
             GIF D'ACCUEIL

             IMPORTANT :

             - aucun src
             - hidden

             Le navigateur ne peut donc pas
             afficher le GIF au premier rendu.

             home-scroll.js l'activera uniquement
             après IMG02.
        ========================================= -->

        <img
            alt=""
            class="welcome-gif"
            aria-hidden="true"
            hidden
        >


    </main>


    <!-- ========================================
         EASTER EGG — JEU
    ========================================= -->

    <div
        class="game-overlay"
        id="gameOverlay"
        aria-hidden="true"
    >

        <div class="game-shell">

            <div class="game-header">

                <div class="game-title">
                    BLIZZARD MODERNE — LE JEU
                </div>


                <button
                    class="game-close"
                    id="gameClose"
                    type="button"
                    aria-label="Fermer le jeu"
                >
                    fermer
                </button>

            </div>


            <div class="game-frame">

                <iframe
                    id="gameIframe"
                    title="Blizzard Moderne — Le Jeu"
                    allow="autoplay; fullscreen; gamepad"
                    allowfullscreen
                ></iframe>

            </div>

        </div>

    </div>


    <!-- ========================================
         SCRIPTS
    ========================================= -->

    <script src="script.js"></script>

    <script src="home-scroll.js"></script>

    <script src="home-easter.js"></script>


</body>

</html>
