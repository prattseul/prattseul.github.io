    <meta charset="UTF-8">

    <meta

        content="width=device-width, initial-scale=1.0"
    >

    <title>PRATTSEUL</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home-scroll.css">
    <link rel="stylesheet" href="home-easter.css">
</head>


<body data-home="true">


    <!-- ========================================
         NAVIGATION COMMUNE
    ========================================= -->

    <div id="site-navigation"></div>


    <!-- ========================================
         ACCUEIL
    ========================================= -->

    <main class="hero">


        <!-- ========================================
             NAVIGATION PERMANENTE ACCUEIL
        ========================================= -->

        <nav
            class="home-menu"
            aria-label="Navigation principale"
        >

            <a href="about.html">
                à propos
            </a>

            <a href="films.html">
                vidéos
            </a>

            <a href="shows.html">
                concerts
            </a>

            <a href="press.html">
                presse
            </a>

            <a href="contact.html">
                contacts
            </a>

        </nav>


        <!-- ========================================
             GIF D'ACCUEIL
        ========================================= -->

        <img
            src="images/welcomeGif.gif"
            alt=""
            class="welcome-gif"
            aria-hidden="true"
        >


    </main>


    <!-- ========================================
         EASTER EGG — JEU
    ========================================= -->

    <div
        class="game-overlay"
        id="gameOverlay"
        aria-hidden="true"
    >

        <div class="game-shell">


            <!-- ========================================
                 HEADER JEU
            ========================================= -->

            <div class="game-header">

                <div class="game-title">
                    BLIZZARD MODERNE — LE JEU
                </div>

                <button
                    class="game-close"
                    id="gameClose"
                    type="button"
                    aria-label="Fermer le jeu"
                >
                    fermer
                </button>

            </div>


            <!-- ========================================
                 IFRAME ITCH.IO
            ========================================= -->

            <div class="game-frame">

                <iframe
                    frameborder="0"
                    src="https://itch.io/embed-upload/16608196?color=000000"
                    allow="autoplay; fullscreen; gamepad"
                    allowfullscreen
                    width="480"
                    height="452"
                    title="Blizzard Moderne — Le Jeu"
                >
                    <a
                        href="https://prattseul.itch.io/blizzard-moderne-le-jeu"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Play BLIZZARD MODERNE - LE JEU on itch.io
                    </a>
                </iframe>

            </div>


            <!-- ========================================
                 LIEN DE SECOURS
            ========================================= -->

            <a
                class="game-external-link"
                href="https://prattseul.itch.io/blizzard-moderne-le-jeu"
                target="_blank"
                rel="noopener noreferrer"
            >
                ouvrir le jeu sur itch.io
            </a>

        </div>

    </div>


    <!-- ========================================
         SCRIPTS
    ========================================= -->

    <script src="script.js"></script>
    <script src="home-scroll.js"></script>
    <script src="home-easter.js"></script>
