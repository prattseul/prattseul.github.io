<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRATTSEUL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">

        <button
            class="menu-button"
            id="openMenu"
            type="button"
        >
            menu
        </button>

    </header>


    <!-- ================================
         MENU
    ================================= -->

    <nav
        class="menu"
        id="menu"
        aria-hidden="true"
    >

        <button
            class="menu-close"
            id="closeMenu"
            type="button"
        >
            close
        </button>


        <div class="menu-list">

            <a href="#home">home</a>
            <a href="#about">about</a>
            <a href="#accounts">official accounts</a>
            <a href="#shop">shop</a>
            <a href="#films">films</a>
            <a href="#shows">shows</a>
            <a href="#press">press</a>
            <a href="#contact">contact</a>

        </div>

    </nav>


    <!-- ================================
         FIXED BACKGROUND
    ================================= -->

    <div class="background">

        <img
            src="IMG02.jpg"
            alt=""
            class="background-image"
        >

        <div class="center-symbol">
            ✦
        </div>

    </div>


    <!-- ================================
         SOCIAL LINKS
    ================================= -->

    <div class="social-links">

        <!-- Instagram -->

        <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        >

            <svg viewBox="0 0 24 24">

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                />

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1"
                    class="filled"
                />

            </svg>

        </a>


        <!-- YouTube -->

        <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M21 12s0-4-1-5-3-1-8-1-7 0-8 1-1 5-1 5 0 4 1 5 3 1 8 1 7 0 8-1 1-5 1-5z"
                />

                <polygon
                    points="10,9 16,12 10,15"
                />

            </svg>

        </a>


        <!-- Spotify -->

        <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Spotify"
        >

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="9"
                />

                <path d="M7 9.5c3.5-1 6.5-.7 10 .7" />

                <path d="M7.5 12.5c3-.7 5.5-.5 8.5.6" />

                <path d="M8.5 15.3c2.3-.5 4.3-.3 6.5.5" />

            </svg>

        </a>


        <!-- Apple Music -->

        <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Apple Music"
        >

            <svg viewBox="0 0 24 24">

                <path d="M16 5v10.5" />

                <path d="M16 7c1.5-1 3-1.2 4-.8" />

                <ellipse
                    cx="13"
                    cy="16.5"
                    rx="3"
                    ry="2"
                />

            </svg>

        </a>


        <!-- Bandcamp -->

        <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Bandcamp"
        >

            <svg viewBox="0 0 24 24">

                <path d="M3 17h10l7-10H10L3 17z" />

            </svg>

        </a>

    </div>


    <!-- ================================
         CONTENT
    ================================= -->

    <main id="home">

        <section class="home-space"></section>


        <section
            class="content-section"
            id="about"
        >

            <h1>about</h1>

        </section>


        <section
            class="content-section"
            id="accounts"
        >

            <h1>official accounts</h1>

        </section>


        <section
            class="content-section"
            id="shop"
        >

            <h1>shop</h1>

        </section>


        <section
            class="content-section"
            id="films"
        >

            <h1>films</h1>

        </section>


        <section
            class="content-section"
            id="shows"
        >

            <h1>shows</h1>

        </section>


        <section
            class="content-section"
            id="press"
        >

            <h1>press</h1>

        </section>


        <section
            class="content-section"
            id="contact"
        >

            <h1>contact</h1>

        </section>

    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        © 2026 PRATTSEUL

    </footer>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>

        const menu =
            document.getElementById("menu");

        const openMenu =
            document.getElementById("openMenu");

        const closeMenu =
            document.getElementById("closeMenu");


        function openNavigation() {

            menu.classList.add("is-open");

            menu.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.classList.add(
                "menu-open"
            );

        }


        function closeNavigation() {

            menu.classList.remove("is-open");

            menu.setAttribute(
                "aria-hidden",
                "true"
            );

            document.body.classList.remove(
                "menu-open"
            );

        }


        openMenu.addEventListener(
            "click",
            openNavigation
        );


        closeMenu.addEventListener(
            "click",
            closeNavigation
        );


        document
            .querySelectorAll(".menu-list a")
            .forEach((link) => {

                link.addEventListener(
                    "click",
                    closeNavigation
                );

            });


        document.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Escape") {
                    closeNavigation();
                }

            }
        );

    </script>

</body>

</html>
