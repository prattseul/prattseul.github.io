<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRATTSEUL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP -->

    <header class="top">

        <a href="#home" class="copyright">
            ©
        </a>

        <button class="menu-button" id="openMenu">
            menu
        </button>

    </header>


    <!-- MENU -->

    <nav class="menu" id="menu">

        <button class="close-button" id="closeMenu">
            Close
        </button>

        <div class="menu-list">

            <a href="#home">home</a>
            <a href="#about">about</a>
            <a href="#accounts">official accounts</a>
            <a href="#shop">shop</a>
            <a href="#films">films</a>
            <a href="#shows">shows</a>
            <a href="#press">press</a>
            <a href="#contact">contact</a>

        </div>
       

    </nav>
     <div class="social-links">

        <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1"></circle>
            </svg>
        </a>
    
        <a href="https://youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12s0-4-1-5-3-1-8-1-7 0-8 1-1 5-1 5 0 4 1 5 3 1 8 1 7 0 8-1 1-5 1-5z"></path>
                <polygon points="10,9 16,12 10,15"></polygon>
            </svg>
        </a>
    
        <a href="https://open.spotify.com/" target="_blank" rel="noopener" aria-label="Spotify">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M7 9.5c3.5-1 6.5-.7 10 .7"></path>
                <path d="M7.5 12.5c3-.7 5.5-.5 8.5.6"></path>
                <path d="M8.5 15.3c2.3-.5 4.3-.3 6.5.5"></path>
            </svg>
        </a>
    
        <a href="https://music.apple.com/" target="_blank" rel="noopener" aria-label="Apple Music">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 5v10.5"></path>
                <path d="M16 7c1.5-1 3-1.2 4-.8"></path>
                <ellipse cx="13" cy="16.5" rx="3" ry="2"></ellipse>
            </svg>
        </a>
    
        <a href="#" target="_blank" rel="noopener" aria-label="Bandcamp">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 17h10l7-10H10L3 17z"></path>
            </svg>
        </a>
    
    </div>


    <!-- HOME -->

    <main>

        <section class="hero" id="home">

            <img
                src="IMG02.jpg"
                alt=""
                class="hero-image"
            >

            <div class="hero-mark">
                ✦
            </div>

        </section>


        <!-- ABOUT -->

        <section class="section" id="about">

            <h1>about</h1>

            <p>
                PRATTSEUL
            </p>

        </section>


        <!-- ACCOUNTS -->

        <section class="section" id="accounts">

            <h1>official accounts</h1>

        </section>


        <!-- SHOP -->

        <section class="section" id="shop">

            <h1>shop</h1>

        </section>


        <!-- FILMS -->

        <section class="section" id="films">

            <h1>films</h1>

        </section>


        <!-- SHOWS -->

        <section class="section" id="shows">

            <h1>shows</h1>

        </section>


        <!-- PRESS -->

        <section class="section" id="press">

            <h1>press</h1>

        </section>


        <!-- CONTACT -->

        <section class="section" id="contact">

            <h1>contact</h1>

        </section>

    </main>


    <!-- BOTTOM -->

    <footer>

        <span>
            © PRATTSEUL
        </span>

    </footer>


    <script>

        const menu = document.getElementById("menu");
        const openMenu = document.getElementById("openMenu");
        const closeMenu = document.getElementById("closeMenu");

        openMenu.addEventListener("click", () => {
            menu.classList.add("is-open");
        });

        closeMenu.addEventListener("click", () => {
            menu.classList.remove("is-open");
        });

        document.querySelectorAll(".menu-list a").forEach(link => {

            link.addEventListener("click", () => {
                menu.classList.remove("is-open");
            });

        });

    </script>

</body>
</html>
