<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PRATTSEUL</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background">

        <img
            src="IMG02.jpg"
            alt=""
        >

    </div>



    <!-- MENU BUTTON -->

    <button
        class="menu-button"
        id="menuOpen"
        type="button"
    >
        menu
    </button>



    <!-- SOCIAL LINKS -->

    <div class="social-links">


        <!-- INSTAGRAM -->

        <a
            href="TON_LIEN_INSTAGRAM"
            aria-label="Instagram"
        >

            <svg viewBox="0 0 24 24">

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                ></rect>

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                ></circle>

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1"
                    class="filled"
                ></circle>

            </svg>

        </a>



        <!-- YOUTUBE -->

        <a
            href="TON_LIEN_YOUTUBE"
            aria-label="YouTube"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M21 12s0-4-1-5-3-1-8-1-7 0-8 1-1 5-1 5 0 4 1 5 3 1 8 1 7 0 8-1 1-5 1-5z"
                ></path>

                <polygon
                    points="10,9 16,12 10,15"
                ></polygon>

            </svg>

        </a>



        <!-- SPOTIFY -->

        <a
            href="TON_LIEN_SPOTIFY"
            aria-label="Spotify"
        >

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="9"
                ></circle>

                <path
                    d="M7 9.5c3.5-1 6.5-.7 10 .7"
                ></path>

                <path
                    d="M7.5 12.5c3-.7 5.5-.5 8.5.6"
                ></path>

                <path
                    d="M8.5 15.3c2.3-.5 4.3-.3 6.5.5"
                ></path>

            </svg>

        </a>



        <!-- APPLE MUSIC -->

        <a
            href="TON_LIEN_APPLE_MUSIC"
            aria-label="Apple Music"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M16 5v10.5"
                ></path>

                <path
                    d="M16 7c1.5-1 3-1.2 4-.8"
                ></path>

                <ellipse
                    cx="13"
                    cy="16.5"
                    rx="3"
                    ry="2"
                ></ellipse>

            </svg>

        </a>



        <!-- DEEZER -->

        <a
            href="TON_LIEN_DEEZER"
            aria-label="Deezer"
        >

            <svg viewBox="0 0 24 24">

                <path d="M3 7h5"></path>
                <path d="M3 11h5"></path>
                <path d="M3 15h5"></path>

                <path d="M10 7h5"></path>
                <path d="M10 11h5"></path>
                <path d="M10 15h5"></path>

                <path d="M17 7h4"></path>
                <path d="M17 11h4"></path>
                <path d="M17 15h4"></path>

            </svg>

        </a>



        <!-- FACEBOOK -->

        <a
            href="TON_LIEN_FACEBOOK"
            aria-label="Facebook"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M14 8h3V4h-3c-3.3 0-5 1.9-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1z"
                ></path>

            </svg>

        </a>


    </div>



    <!-- COMPACT MENU -->

    <nav
        class="menu"
        id="menu"
    >

        <button
            class="menu-close"
            id="menuClose"
            type="button"
        >
            close
        </button>


        <div class="menu-list">

            <a href="#home">
                home
            </a>

            <a href="#about">
                about
            </a>

            <a href="#accounts">
                official accounts
            </a>

            <a href="#shop">
                shop
            </a>

            <a href="#films">
                films
            </a>

            <a href="#shows">
                shows
            </a>

            <a href="#press">
                press
            </a>

            <a href="#contact">
                contact
            </a>

        </div>

    </nav>



    <!-- CONTENT -->

    <main>


        <section
            id="home"
            class="home"
        >
        </section>



        <section
            id="about"
            class="section"
        >

            <h1>
                about
            </h1>

        </section>



        <section
            id="accounts"
            class="section"
        >

            <h1>
                official accounts
            </h1>

        </section>



        <section
            id="shop"
            class="section"
        >

            <h1>
                shop
            </h1>

        </section>



        <section
            id="films"
            class="section"
        >

            <h1>
                films
            </h1>

        </section>



        <section
            id="shows"
            class="section"
        >

            <h1>
                shows
            </h1>

        </section>



        <section
            id="press"
            class="section"
        >

            <h1>
                press
            </h1>

        </section>



        <section
            id="contact"
            class="section"
        >

            <h1>
                contact
            </h1>

        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
