<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon site</title>

    <style>
        /* =========================
           BASE
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #fff;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           PAGE
        ========================= */

        .site {
            width: 100%;
            height: 100vh;
            position: relative;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            z-index: 100;
            mix-blend-mode: difference;
            color: white;
        }

        .logo {
            font-size: 15px;
            letter-spacing: 0.08em;
            font-weight: 400;
        }

        .menu-button {
            border: 0;
            background: none;
            color: inherit;

            font-family: inherit;
            font-size: 14px;

            cursor: pointer;
            letter-spacing: 0.05em;
        }


        /* =========================
           MENU
        ========================= */

        .menu {
            position: fixed;
            inset: 0;

            background: #fff;

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 60px;

            z-index: 90;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }

        .menu.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .menu-close {
            position: absolute;
            top: 25px;
            right: 30px;

            border: 0;
            background: none;

            font-size: 14px;
            cursor: pointer;
        }

        .menu a {
            width: fit-content;

            font-size: clamp(32px, 6vw, 80px);
            line-height: 1.05;

            letter-spacing: -0.04em;

            transition: opacity 0.2s ease;
        }

        .menu:hover a {
            opacity: 0.25;
        }

        .menu a:hover {
            opacity: 1;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            overflow: hidden;
        }

        .hero-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        /*
            Image de démonstration.
            Remplace-la par ton propre fichier :
            
            images/hero.jpg
        */

        .hero-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #d9d9d9 0%,
                    #999 35%,
                    #222 100%
                );

            color: white;
            font-size: clamp(40px, 10vw, 160px);

            letter-spacing: -0.08em;
        }


        /* =========================
           TEXTE CENTRAL
        ========================= */

        .hero-title {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-size: clamp(50px, 12vw, 180px);
            font-weight: 400;

            letter-spacing: -0.08em;

            pointer-events: none;

            mix-blend-mode: difference;

            white-space: nowrap;
        }


        /* =========================
           INFOS
        ========================= */

        .copyright {
            position: fixed;

            bottom: 20px;
            left: 30px;

            font-size: 11px;
            letter-spacing: 0.04em;

            z-index: 20;

            mix-blend-mode: difference;
            color: white;
        }

        .social {
            position: fixed;

            bottom: 20px;
            right: 30px;

            display: flex;
            gap: 18px;

            font-size: 11px;

            z-index: 20;

            mix-blend-mode: difference;
            color: white;
        }

        .social a:hover {
            text-decoration: underline;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                height: 60px;
                padding: 0 20px;
            }

            .menu {
                padding: 30px;
            }

            .menu a {
                font-size: 42px;
            }

            .hero-title {
                font-size: 18vw;
            }

            .copyright {
                left: 20px;
                bottom: 15px;
            }

            .social {
                right: 20px;
                bottom: 15px;
            }
        }
    </style>
</head>


<body>

    <div class="site">

        <!-- =========================
             HEADER
        ========================== -->

        <header>

            <a href="#" class="logo">
                MY SITE
            </a>

            <button
                class="menu-button"
                id="openMenu"
                aria-label="Ouvrir le menu"
            >
                MENU
            </button>

        </header>


        <!-- =========================
             MENU
        ========================== -->

        <nav class="menu" id="menu">

            <button
                class="menu-close"
                id="closeMenu"
            >
                CLOSE
            </button>

            <a href="#home">HOME</a>
            <a href="#about">ABOUT</a>
            <a href="#work">WORK</a>
            <a href="#films">FILMS</a>
            <a href="#shows">SHOWS</a>
            <a href="#press">PRESS</a>
            <a href="#contact">CONTACT</a>

        </nav>


        <!-- =========================
             HERO
        ========================== -->

        <main id="home">

            <section class="hero">

                <!--
                    Quand tu auras ton image,
                    remplace le div ci-dessous par :

                    <img
                        src="images/hero.jpg"
                        class="hero-image"
                        alt=""
                    >
                -->

                <div class="hero-placeholder">
                    ✦
                </div>

                <h1 class="hero-title">
                    YOUR NAME
                </h1>

            </section>

        </main>


        <!-- =========================
             FOOTER / INFOS
        ========================== -->

        <div class="copyright">
            © 2026 YOUR NAME
        </div>

        <div class="social">
            <a href="#">INSTAGRAM</a>
            <a href="#">YOUTUBE</a>
        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const menu = document.getElementById("menu");
        const openMenu = document.getElementById("openMenu");
        const closeMenu = document.getElementById("closeMenu");

        openMenu.addEventListener("click", () => {
            menu.classList.add("active");
        });

        closeMenu.addEventListener("click", () => {
            menu.classList.remove("active");
        });

        // Fermer le menu lorsqu'on clique sur un lien
        document.querySelectorAll(".menu a").forEach(link => {

            link.addEventListener("click", () => {
                menu.classList.remove("active");
            });

        });

    </script>

</body>
</html>
