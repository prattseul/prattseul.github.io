<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Download — Blizzard Moderne — Prattseul</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="download.css"
    >

</head>


<body data-page-title="download">


    <!-- ========================================
         NAVIGATION COMMUNE
    ========================================= -->

    <div id="site-navigation"></div>


    <!-- ========================================
         DOWNLOAD
    ========================================= -->

    <main class="internal-content download-page">

        <section class="download-content">


            <!-- ========================================
                 ALBUM
            ========================================= -->

            <div class="download-album">


                <!-- POCHETTE -->

                <figure class="download-cover">

                    <img
                        src="images/ARTWORK_ALB_BM_PRATTSEUL.jpg"
                        alt="Pochette de l’album Blizzard Moderne de Prattseul"
                    >

                </figure>


                <!-- TEXTE -->

                <div class="download-copy">

                    <p class="download-kicker">
                        Prattseul
                    </p>

                    <h1 class="download-title">
                        Blizzard Moderne
                    </h1>

                    <p class="download-subtitle">
                        téléchargement de l’album
                    </p>

                    <p class="download-intro">
                        Entrez l’adresse e-mail utilisée lors de votre contribution Ulule.
                    </p>

                </div>


            </div>


            <!-- ========================================
                 FORMULAIRE
            ========================================= -->

            <form
                class="download-form"
                id="downloadForm"
                novalidate
            >

                <label
                    class="download-label"
                    for="downloadEmail"
                >
                    adresse e-mail
                </label>


                <input
                    class="download-input"
                    id="downloadEmail"
                    name="email"
                    type="email"
                    inputmode="email"
                    autocomplete="email"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                >


                <button
                    class="download-button"
                    type="submit"
                >
                    télécharger l’album
                </button>


                <p
                    class="download-message"
                    id="downloadMessage"
                    aria-live="polite"
                ></p>

            </form>


        </section>

    </main>


    <!-- ========================================
         SCRIPT COMMUN
    ========================================= -->

    <script src="script.js"></script>


</body>

</html>
